[project]
name = "datamart-product-api"
version = "1.0.0"
description = "API de Catálogo de Productos Legado para DataMart"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"